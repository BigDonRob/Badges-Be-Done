name: Build Releases

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Cross-compile all platforms
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build all targets
        run: |
          mkdir -p dist
          cd imgsorter

          # Windows x64
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/imgsorter-windows.exe .

          # macOS Intel
          GOOS=darwin  GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/imgsorter-mac-intel .

          # macOS Apple Silicon
          GOOS=darwin  GOARCH=arm64 go build -ldflags="-s -w" -o ../dist/imgsorter-mac-arm .

          # Linux x64
          GOOS=linux   GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/imgsorter-linux .

          cd ..
          ls -lh dist/

      # macOS universal binary (Intel + Apple Silicon in one file)
      - name: Make macOS universal binary
        run: |
          brew install llvm || true
          if command -v lipo &>/dev/null; then
            lipo -create -output dist/imgsorter-mac \
              dist/imgsorter-mac-intel \
              dist/imgsorter-mac-arm
          else
            cp dist/imgsorter-mac-arm dist/imgsorter-mac
          fi

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: imgsorter-builds
          path: dist/

      # Auto-create a GitHub Release on tag push
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/imgsorter-windows.exe
            dist/imgsorter-mac
            dist/imgsorter-mac-intel
            dist/imgsorter-mac-arm
            dist/imgsorter-linux
